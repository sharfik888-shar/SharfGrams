<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SharfGrams 🧣</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: #000; color: #fff; height: 100vh; overflow: hidden; display: flex; justify-content: center; }

        .app { width: 100%; max-width: 450px; height: 100vh; background: #0e1621; position: relative; overflow: hidden; display: flex; flex-direction: column; }

        /* Верхняя панель */
        .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; background: #17212b; z-index: 10; }
        .menu-btn { font-size: 24px; color: #7d8b99; cursor: pointer; }
        .search-bar { flex: 1; margin: 0 15px; background: #242f3d; border-radius: 10px; padding: 8px 15px; color: #7d8b99; font-size: 15px; border: none; outline: none; }
        .search-bar::placeholder { color: #7d8b99; }

        /* Список чатов */
        .chat-list { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .chat-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #242f3d; cursor: pointer; transition: 0.2s; }
        .chat-item:hover { background: #202b36; }
        .avatar { width: 55px; height: 55px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 20px; margin-right: 15px; color: white; flex-shrink: 0; }
        .chat-info { flex: 1; overflow: hidden; }
        .chat-header-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .chat-name { font-size: 16px; font-weight: 600; color: #fff; }
        .chat-time { font-size: 12px; color: #7d8b99; }
        .chat-last-msg { font-size: 14px; color: #7d8b99; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Нижнее меню (таб-бар) */
        .tab-bar { position: absolute; bottom: 0; width: 100%; height: 60px; background: #17212b; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #242f3d; z-index: 20; }
        .tab-item { display: flex; flex-direction: column; align-items: center; color: #7d8b99; font-size: 11px; cursor: pointer; transition: 0.2s; }
        .tab-item.active { color: #5eb5f7; }
        .tab-icon { font-size: 22px; margin-bottom: 2px; }

        /* Кнопка "Написать" */
        .fab { position: absolute; bottom: 80px; right: 20px; width: 55px; height: 55px; border-radius: 50%; background: #5eb5f7; border: none; color: white; font-size: 24px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 15px rgba(94, 181, 247, 0.4); z-index: 15; transition: 0.2s; }
        .fab:hover { transform: scale(1.05); background: #4aa3e0; }

        /* --- ЭКРАН ПЕРЕПИСКИ --- */
        #chatScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0e1621; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s ease; z-index: 30; }
        #chatScreen.active { transform: translateX(0); }
        .chat-header { background: #17212b; padding: 10px 15px; display: flex; align-items: center; border-bottom: 1px solid #242f3d; }
        .back-btn { background: none; border: none; color: #5eb5f7; font-size: 24px; cursor: pointer; margin-right: 10px; }
        .chat-header .avatar { width: 40px; height: 40px; font-size: 16px; margin-right: 10px; }
        .chat-header-info h2 { font-size: 16px; color: #fff; }
        .chat-header-info p { font-size: 12px; color: #5eb5f7; }

        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 15px; line-height: 1.4; word-wrap: break-word; animation: pop 0.2s ease-out; }
        .msg.my-msg { background: #2b5278; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.other-msg { background: #182533; align-self: flex-start; border-bottom-left-radius: 4px; }
        @keyframes pop { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .input-area { background: #17212b; padding: 10px 15px; display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px 18px; border-radius: 20px; border: none; background: #242f3d; color: white; font-size: 15px; outline: none; }
        .send-btn { width: 45px; height: 45px; border-radius: 50%; background: #5eb5f7; border: none; color: white; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div class="app">
        
        <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
        <div class="top-bar">
            <div class="menu-btn">☰</div>
            <input type="text" class="search-bar" placeholder="Поиск">
            <div style="width: 24px;"></div> <!-- Заглушка для симметрии -->
        </div>

        <!-- СПИСОК ЧАТОВ -->
        <div class="chat-list" id="chatList">
            <!-- Сюда будут загружаться чаты с сервера -->
        </div>

        <!-- КНОПКА "НАПИСАТЬ" -->
        <button class="fab">✏️</button>

        <!-- НИЖНЕЕ МЕНЮ -->
        <div class="tab-bar">
            <div class="tab-item"><span class="tab-icon">👤</span>Контакты</div>
            <div class="tab-item active"><span class="tab-icon">💬</span>Чаты</div>
            <div class="tab-item"><span class="tab-icon">⚙️</span>Настройки</div>
        </div>

        <!-- ЭКРАН ПЕРЕПИСКИ -->
        <div id="chatScreen">
            <div class="chat-header">
                <button class="back-btn" onclick="closeChat()">←</button>
                <div class="avatar" id="currentAvatar">?</div>
                <div class="chat-header-info">
                    <h2 id="currentChatName">Чат</h2>
                    <p>в сети</p>
                </div>
            </div>
            <div id="messages"></div>
            <div class="input-area">
                <input type="text" id="msgInput" placeholder="Написать сообщение..." onkeypress="if(event.key === 'Enter') sendMsg()">
                <button class="send-btn" onclick="sendMsg()">➤</button>
            </div>
        </div>

    </div>

    <script>
        // Подключение к твоему серверу на Render
        const ws = new WebSocket('wss://sharfgrams.onrender.com');
        
        let currentChatId = null;
        let allChats = [];

        const chatListEl = document.getElementById('chatList');
        const messagesContainer = document.getElementById('messages');

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'init') {
                allChats = data.chats;
                renderChatList();
            } 
            else if (data.type === 'message') {
                if (data.chatId === currentChatId) {
                    addMessageToScreen(data.text, false);
                }
                
                const chatIndex = allChats.findIndex(c => c.id === data.chatId);
                if (chatIndex !== -1) {
                    allChats[chatIndex].lastMsg = data.text;
                    renderChatList();
                }
            }
        };

        function renderChatList() {
            chatListEl.innerHTML = '';
            // Время для красоты (как в телеге)
            const now = new Date();
            const timeStr = now.getHours() + ':' + now.getMinutes().toString().padStart(2, '0');

            allChats.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.onclick = () => openChat(chat);
                div.innerHTML = `
                    <div class="avatar" style="background: ${chat.color}">${chat.avatar}</div>
                    <div class="chat-info">
                        <div class="chat-header-row">
                            <span class="chat-name">${chat.name}</span>
                            <span class="chat-time">${timeStr}</span>
                        </div>
                        <div class="chat-last-msg">${chat.lastMsg || 'Нет сообщений'}</div>
                    </div>
                `;
                chatListEl.appendChild(div);
            });
        }

        function openChat(chat) {
            currentChatId = chat.id;
            document.getElementById('currentChatName').textContent = chat.name;
            const avatarEl = document.getElementById('currentAvatar');
            avatarEl.textContent = chat.avatar;
            avatarEl.style.background = chat.color;
            
            messagesContainer.innerHTML = '';
            document.getElementById('chatScreen').classList.add('active');
        }

        function closeChat() {
            currentChatId = null;
            document.getElementById('chatScreen').classList.remove('active');
        }

        function sendMsg() {
            const inputField = document.getElementById('msgInput');
            const text = inputField.value.trim();
            
            if (text !== '' && currentChatId !== null) {
                ws.send(JSON.stringify({ type: 'message', chatId: currentChatId, text: text }));
                addMessageToScreen(text, true);
                inputField.value = '';
            }
        }

        function addMessageToScreen(text, isMine) {
            const div = document.createElement('div');
            div.className = `msg ${isMine ? 'my-msg' : 'other-msg'}`;
            div.textContent = text;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    </script>
</body>
</html>
