<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SharfGrams</title>
    <style>
        /* Базовый сброс и цвета как в ТГ (Dark Theme) */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: #0e1621; color: #fff; height: 100vh; overflow: hidden; display: flex; justify-content: center; }

        .app { width: 100%; max-width: 450px; height: 100vh; background: #0e1621; position: relative; overflow: hidden; display: flex; flex-direction: column; }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .top-bar { padding: 10px 15px; background: #17212b; display: flex; flex-direction: column; gap: 10px; z-index: 10; }
        .top-header { display: flex; justify-content: space-between; align-items: center; }
        .top-header h1 { font-size: 20px; font-weight: 500; }
        .menu-btn { font-size: 20px; color: #7d8b99; cursor: pointer; }
        
        .search-bar { background: #242f3d; border-radius: 10px; padding: 10px 15px; color: #7d8b99; font-size: 15px; display: flex; align-items: center; gap: 10px; }
        .search-bar input { background: none; border: none; color: #fff; outline: none; flex: 1; font-size: 15px; }
        .search-bar input::placeholder { color: #7d8b99; }

        /* СПИСОК ЧАТОВ */
        .chat-list { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .chat-item { display: flex; align-items: center; padding: 10px 15px; cursor: pointer; position: relative; }
        .chat-item:hover { background: #202b36; }
        
        .avatar { width: 54px; height: 54px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 20px; margin-right: 15px; color: white; flex-shrink: 0; position: relative; }
        .online-dot { position: absolute; bottom: 0; right: 0; width: 14px; height: 14px; background: #31a24c; border: 2px solid #17212b; border-radius: 50%; display: none; }
        
        .chat-info { flex: 1; overflow: hidden; border-bottom: 1px solid #242f3d; padding-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
        .chat-item:last-child .chat-info { border-bottom: none; }
        
        .chat-top { display: flex; justify-content: space-between; align-items: baseline; }
        .chat-name { font-size: 16px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-time { font-size: 12px; color: #7d8b99; }
        
        .chat-bottom { display: flex; justify-content: space-between; align-items: center; }
        .chat-last-msg { font-size: 14px; color: #7d8b99; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; padding-right: 10px; }
        
        /* Непрочитанные сообщения */
        .unread-badge { background: #5eb5f7; color: white; font-size: 12px; font-weight: bold; padding: 2px 6px; border-radius: 10px; min-width: 20px; text-align: center; }

        /* КНОПКА "+" (FAB) */
        .fab { position: absolute; bottom: 80px; right: 20px; width: 55px; height: 55px; border-radius: 50%; background: #5eb5f7; border: none; color: white; font-size: 28px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 15; transition: 0.2s; }
        .fab:hover { transform: scale(1.05); background: #4aa3e0; }

        /* НИЖНЕЕ МЕНЮ (TAB BAR) */
        .tab-bar { position: absolute; bottom: 0; width: 100%; height: 60px; background: #17212b; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #242f3d; z-index: 20; }
        .tab-item { display: flex; flex-direction: column; align-items: center; color: #7d8b99; font-size: 11px; cursor: pointer; transition: 0.2s; width: 25%; position: relative; }
        .tab-item.active { color: #5eb5f7; }
        .tab-icon { font-size: 22px; margin-bottom: 2px; }
        
        /* Бейдж на иконке чатов */
        .tab-badge { position: absolute; top: -5px; right: 15px; background: #5eb5f7; color: white; font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 10px; }

        /* --- ЭКРАН ПЕРЕПИСКИ --- */
        #chatScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0e1621; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s ease; z-index: 30; }
        #chatScreen.active { transform: translateX(0); }
        
        .chat-header { background: #17212b; padding: 10px 15px; display: flex; align-items: center; border-bottom: 1px solid #242f3d; z-index: 10; }
        .back-btn { background: none; border: none; color: #5eb5f7; font-size: 24px; cursor: pointer; margin-right: 10px; padding: 5px; }
        .chat-header .avatar { width: 42px; height: 42px; font-size: 16px; margin-right: 10px; }
        .chat-header-info h2 { font-size: 16px; font-weight: 600; color: #fff; }
        .chat-header-info p { font-size: 13px; color: #5eb5f7; }
        .header-actions { margin-left: auto; display: flex; gap: 15px; color: #7d8b99; font-size: 20px; }

        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-wrap: break-word; animation: pop 0.2s ease-out; }
        .msg.my-msg { background: #2b5278; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.other-msg { background: #182533; align-self: flex-start; border-bottom-left-radius: 4px; }
        @keyframes pop { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .input-area { background: #17212b; padding: 10px 15px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #242f3d; }
        .input-area input { flex: 1; padding: 12px 18px; border-radius: 20px; border: none; background: #242f3d; color: white; font-size: 15px; outline: none; }
        .send-btn { width: 45px; height: 45px; border-radius: 50%; background: #5eb5f7; border: none; color: white; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        
    </style>
</head>
<body>
    <div class="app">
        
        <!-- ВЕРХНЯЯ ПАНЕЛЬ И ПОИСК -->
        <div class="top-bar" id="mainTopBar">
            <div class="top-header">
                <h1>SharfGrams</h1>
                <div class="menu-btn">⋮</div>
            </div>
            <div class="search-bar">
                <span>🔍</span>
                <input type="text" placeholder="Search Chats">
            </div>
        </div>

        <!-- СПИСОК ЧАТОВ -->
        <div class="chat-list" id="chatList">
            <!-- Сюда будут загружаться чаты -->
        </div>

        <!-- КНОПКА "СОЗДАТЬ ЧАТ" -->
        <button class="fab" onclick="alert('Функция создания чата скоро появится!')">+</button>

        <!-- НИЖНЕЕ МЕНЮ -->
        <div class="tab-bar" id="mainTabBar">
            <div class="tab-item active" id="tabChats">
                <span class="tab-icon">💬</span>
                Chats
            </div>
            <div class="tab-item">
                <span class="tab-icon">👤</span>
                Contacts
            </div>
            <div class="tab-item">
                <span class="tab-icon">⚙️</span>
                Settings
            </div>
            <div class="tab-item">
                <span class="tab-icon" style="border-radius:50%; border: 2px solid white; width: 24px; height: 24px; display:flex; align-items:center; justify-content:center; font-size:14px;">🧣</span>
                Профиль
            </div>
        </div>

        <!-- ЭКРАН ПЕРЕПИСКИ -->
        <div id="chatScreen">
            <div class="chat-header">
                <button class="back-btn" onclick="closeChat()">←</button>
                <div class="avatar" id="currentAvatar">?</div>
                <div class="chat-header-info">
                    <h2 id="currentChatName">Чат</h2>
                    <p id="chatStatus">в сети</p>
                </div>
                <div class="header-actions">
                    <span>📞</span>
                    <span>⋮</span>
                </div>
            </div>
            <div id="messages"></div>
            <div class="input-area">
                <input type="text" id="msgInput" placeholder="Message..." onkeypress="if(event.key === 'Enter') sendMsg()">
                <button class="send-btn" onclick="sendMsg()">➤</button>
            </div>
        </div>

    </div>

    <script>
        // Ссылка на твой сервер
        const ws = new WebSocket('wss://sharfgrams.onrender.com');
        
        let currentChatId = null;
        let allChats = [];

        const chatListEl = document.getElementById('chatList');
        const messagesContainer = document.getElementById('messages');
        const chatScreen = document.getElementById('chatScreen');
        const mainTopBar = document.getElementById('mainTopBar');
        const mainTabBar = document.getElementById('mainTabBar');

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'init') {
                // Получаем список чатов от сервера
                allChats = data.chats;
                renderChatList();
            } 
            else if (data.type === 'message') {
                // Если чат открыт, рисуем сообщение
                if (data.chatId === currentChatId) {
                    addMessageToScreen(data.text, false);
                }
                
                // Обновляем последнее сообщение и время
                const chatIndex = allChats.findIndex(c => c.id === data.chatId);
                if (chatIndex !== -1) {
                    allChats[chatIndex].lastMsg = data.text;
                    allChats[chatIndex].time = getCurrentTime();
                    // Имитация непрочитанного, если чат закрыт (для красоты)
                    if (currentChatId !== data.chatId) {
                        allChats[chatIndex].unread = (allChats[chatIndex].unread || 0) + 1;
                    }
                    renderChatList();
                }
            }
        };

        function getCurrentTime() {
            const now = new Date();
            return now.getHours() + ':' + now.getMinutes().toString().padStart(2, '0');
        }

        function renderChatList() {
            chatListEl.innerHTML = '';
            
            // Если чатов нет, показываем заглушку
            if (allChats.length === 0) {
                chatListEl.innerHTML = '<div style="text-align:center; padding: 40px; color:#7d8b99;">Нет чатов. Нажмите "+" чтобы создать.</div>';
                return;
            }

            allChats.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.onclick = () => openChat(chat);
                
                // Проверка на непрочитанные
                const unreadHtml = chat.unread ? `<div class="unread-badge">${chat.unread}</div>` : '';
                
                div.innerHTML = `
                    <div class="avatar" style="background: ${chat.color || '#5eb5f7'}">
                        ${chat.avatar || chat.name.charAt(0)}
                    </div>
                    <div class="chat-info">
                        <div class="chat-top">
                            <span class="chat-name">${chat.name}</span>
                            <span class="chat-time">${chat.time || getCurrentTime()}</span>
                        </div>
                        <div class="chat-bottom">
                            <span class="chat-last-msg">${chat.lastMsg || 'Нет сообщений'}</span>
                            ${unreadHtml}
                        </div>
                    </div>
                `;
                chatListEl.appendChild(div);
            });
        }

        function openChat(chat) {
            currentChatId = chat.id;
            document.getElementById('currentChatName').textContent = chat.name;
            const avatarEl = document.getElementById('currentAvatar');
            avatarEl.textContent = chat.avatar || chat.name.charAt(0);
            avatarEl.style.background = chat.color || '#5eb5f7';
            
            // Сбрасываем непрочитанные для этого чата
            chat.unread = 0;
            renderChatList();

            messagesContainer.innerHTML = '';
            
            // Скрываем главное меню, показываем переписку
            chatScreen.classList.add('active');
        }

        function closeChat() {
            currentChatId = null;
            chatScreen.classList.remove('active');
        }

        function sendMsg() {
            const inputField = document.getElementById('msgInput');
            const text = inputField.value.trim();
            
            if (text !== '' && currentChatId !== null) {
                ws.send(JSON.stringify({ type: 'message', chatId: currentChatId, text: text }));
                addMessageToScreen(text, true);
                inputField.value = '';
            }
        }

        function addMessageToScreen(text, isMine) {
            const div = document.createElement('div');
            div.className = `msg ${isMine ? 'my-msg' : 'other-msg'}`;
            div.textContent = text;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    </script>
</body>
</html>
